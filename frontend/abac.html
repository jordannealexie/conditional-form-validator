<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABAC Policies - SecureFlow Auth System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>🔐 RBAC System</h2>
                <button class="menu-toggle" id="menuToggle">☰</button>
            </div>

            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="dashboard.html">
                        <span class="icon">📊</span>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="users.html">
                        <span class="icon">👥</span>
                        <span>Users</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="roles.html">
                        <span class="icon">🎭</span>
                        <span>Roles</span>
                    </a>
                </li>
                <li class="nav-item active">
                    <a href="abac.html">
                        <span class="icon">📋</span>
                        <span>ABAC Policies</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="rebac.html">
                        <span class="icon">🔗</span>
                        <span>ReBAC</span>
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <div class="user-info" id="userInfo">
                    <div class="user-avatar">👤</div>
                    <div class="user-details">
                        <span class="user-name" id="userName">Loading...</span>
                        <span class="user-role" id="userRole">User</span>
                    </div>
                </div>
                <button class="btn btn-danger btn-block" onclick="logout()">
                    Logout
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="page-header">
                <h1>ABAC Policies</h1>
                <p class="page-subtitle">Define attribute-based access control policies</p>
            </header>

            <!-- Add Policy Form -->
            <div class="content-section">
                <div class="section-header">
                    <h2>Add New Policy</h2>
                    <button class="btn btn-primary" onclick="toggleAddPolicyForm()">
                        <span>+</span> Add Policy
                    </button>
                </div>

                <form id="addPolicyForm" class="form-container" style="display: none;">
                    <div class="form-group">
                        <label for="policyName">Policy Name</label>
                        <input type="text" id="policyName" required>
                    </div>

                    <div class="form-group">
                        <label for="policyDescription">Description</label>
                        <textarea id="policyDescription" rows="3"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="resource">Resource</label>
                        <input type="text" id="resource" placeholder="e.g., document, user, etc." required>
                    </div>

                    <div class="form-group">
                        <label for="action">Action</label>
                        <select id="action" required>
                            <option value="">Select Action</option>
                            <option value="read">Read</option>
                            <option value="write">Write</option>
                            <option value="delete">Delete</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Conditions</label>
                        <div class="conditions-builder" id="conditionsBuilder">
                            <!-- Conditions will be built here -->
                        </div>
                        <button type="button" class="btn btn-secondary btn-sm" onclick="addCondition()">Add
                            Condition</button>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Create Policy</button>
                        <button type="button" class="btn btn-secondary" onclick="toggleAddPolicyForm()">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- Policies List -->
            <div class="content-section">
                <h2>Existing Policies</h2>
                <div class="table-container">
                    <table class="data-table" id="policiesTable">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Resource</th>
                                <th>Action</th>
                                <th>Conditions</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="policiesTableBody">
                            <!-- Policies will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/abac.js"></script>
</body>

</html>
