<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Form Submission</title>
    <link rel="stylesheet" href="css/index.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation (same as dashboard) -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Form Submission</h2>
                <button class="menu-toggle" id="menuToggle">☰</button>
            </div>

            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="dashboard.html">
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item active" data-permission="users" data-action="read">
                    <a href="users.html">
                        <span>User Management</span>
                    </a>
                </li>
                <li class="nav-item" data-permission="templates" data-action="read">
                    <a href="admin-templates.html">
                        <span>Form Templates</span>
                    </a>
                </li>
                <li class="nav-item" data-permission="submissions" data-action="read">
                    <a href="submissions.html">
                        <span>Submissions</span>
                    </a>
                </li>
                <li class="nav-item" data-permission="roles" data-action="read">
                    <a href="roles.html">
                        <span>Roles & Permissions</span>
                    </a>
                </li>
                <li class="nav-item" data-permission="policies" data-action="read">
                    <a href="abac.html">
                        <span>ABAC Policies</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="profile.html">
                        <span>My Profile</span>
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <div class="user-info" id="userInfo">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div class="user-details">
                        <span class="user-name" id="userName">Loading...</span>
                        <span class="user-role" id="userRole">User</span>
                    </div>
                </div>
                <button class="btn btn-danger btn-block" onclick="logout()">
                    Logout
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="content-header">
                <h1>User Management</h1>
                <p class="page-subtitle">Manage users, roles, and permissions</p>
            </header>

            <!-- Users Table -->
            <div class="table-container">
                <div class="table-header">
                    <div class="search-box">
                        <input type="text" id="searchUsers" placeholder="Search users..."
                            onkeyup="debounce(() => filterTable('usersTable', this.value), 300)()">
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn btn-info" onclick="showAuditTrail({ resourceType: 'user' })" data-permission="users"
                            data-action="read">
                            📋 Audit Trail
                        </button>
                        <button class="btn btn-primary" onclick="showAddUserModal()" data-permission="users"
                            data-action="create">
                            + Add User
                        </button>
                    </div>
                </div>

                <div class="table-wrapper">
                    <table id="usersTable" class="audit-table">
                        <thead>
                            <tr>
                                <th class="sticky-col">Username</th>
                                <th>ID</th>
                                <th>Email</th>
                                <th>Department</th>
                                <th>Location</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Created At</th>
                                <th>Updated At</th>
                                <th class="actions-col">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <!-- Populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="js/utils.js?v=9"></script>
    <script src="js/api.js?v=9"></script>
    <script src="js/auth.js?v=9"></script>
    <script src="js/dropdown-loader.js?v=4"></script>
    <script src="js/users.js?v=10"></script>
</body>

</html>
